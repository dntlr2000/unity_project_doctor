name: Static fixture tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run PowerShell fixture tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests.ps1

      - name: Verify checkout remained unchanged
        shell: powershell
        run: |
          git diff --exit-code
          $status = @(git status --short --untracked-files=all)
          if ($status.Count -ne 0) {
            $status | Write-Host
            throw "Static tests changed the checkout."
          }
